<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Counting</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      padding: 12px;
      margin-bottom: 10px;
    }

    .search-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group label {
      font-weight: 600;
      color: #333;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .radio-group {
      display: flex;
      gap: 10px;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .radio-item input[type="radio"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .radio-item label {
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
    }

    input[type="date"] {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.8rem;
      width: 130px;
    }

    input[type="date"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .button-group {
      display: flex;
      gap: 6px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status-info {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
    }

    .status-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-success {
      background: #d4edda;
      color: #155724;
    }

    .badge-info {
      background: #d1ecf1;
      color: #0c5460;
    }

    .data-table-container {
      overflow-x: auto;
      max-height: 500px;
      overflow-y: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .data-table th {
      background: #667eea;
      color: white;
      padding: 8px 10px;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 10;
      font-size: 0.75rem;
    }

    .data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    .data-table tr:hover {
      background: #f5f5f5;
    }

    .data-table tr:nth-child(even) {
      background: #f9f9f9;
    }

    .data-table tr:nth-child(even):hover {
      background: #f0f0f0;
    }

    .match {
      color: #28a745;
      font-weight: 600;
    }

    .unmatch {
      color: #dc3545;
      font-weight: 600;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 30px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: #6c757d;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
      font-size: 0.85rem;
    }

    .error-message.show {
      display: block;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .summary-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .summary-card.green {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    }

    .summary-card.orange {
      background: linear-gradient(135deg, #fd7e14 0%, #ffc107 100%);
    }

    .summary-card.red {
      background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
    }

    .summary-card h3 {
      font-size: 1.3rem;
      margin-bottom: 2px;
    }

    .summary-card p {
      font-size: 0.7rem;
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      .search-box {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-group {
        width: 100%;
        flex-wrap: wrap;
      }

      .radio-group {
        flex-wrap: wrap;
      }

      .status-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .summary-cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .data-table {
        font-size: 0.7rem;
      }

      .data-table th,
      .data-table td {
        padding: 5px 6px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 5px;
      }

      .card {
        padding: 8px;
      }

      .summary-cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
      }

      .summary-card {
        padding: 8px;
      }

      .summary-card h3 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="search-box">
        <div class="form-group">
          <label>Plant:</label>
          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" id="plantSiam" name="plant" value="SIAM">
              <label for="plantSiam">SIAM</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="plantAsia" name="plant" value="ASIA">
              <label for="plantAsia">ASIA</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="plantThai" name="plant" value="THAI">
              <label for="plantThai">THAI</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="countDate">Date:</label>
          <input type="date" id="countDate">
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="searchBtn" onclick="searchData()">Search</button>
          <button class="btn btn-secondary" onclick="clearData()">Clear</button>
        </div>
      </div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="card" id="resultCard" style="display: none;">
      <div class="status-bar">
        <div class="status-info">
          <div class="status-item">
            <span>Plant:</span>
            <span class="status-badge badge-info" id="displayPlant">-</span>
          </div>
          <div class="status-item">
            <span>Date:</span>
            <span class="status-badge badge-info" id="displayDate">-</span>
          </div>
        </div>
        <div class="status-item">
          <span>Items:</span>
          <span class="status-badge badge-success" id="displayCount">0</span>
        </div>
      </div>

      <div class="summary-cards" id="summaryCards">
        <div class="summary-card">
          <h3 id="totalItems">0</h3>
          <p>Total</p>
        </div>
        <div class="summary-card green">
          <h3 id="matchItems">0</h3>
          <p>Match</p>
        </div>
        <div class="summary-card orange">
          <h3 id="pendingItems">0</h3>
          <p>Pending</p>
        </div>
        <div class="summary-card red">
          <h3 id="unmatchItems">0</h3>
          <p>Unmatch</p>
        </div>
      </div>

      <div class="loading" id="loadingIndicator">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>

      <div class="data-table-container" id="tableContainer">
        <table class="data-table" id="dataTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Part Number</th>
              <th>Part Name</th>
              <th>Location</th>
              <th>UOM</th>
              <th>Suggest</th>
              <th>Count 1st</th>
              <th>Result 1st</th>
              <th>Count 2nd</th>
              <th>Result 2nd</th>
              <th>Count 3rd</th>
              <th>Result 3rd</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>

      <div class="no-data" id="noData" style="display: none;">
        <p>No data found</p>
      </div>
    </div>
  </div>

  <script>
    // Store data in RAM
    let inventoryData = [];
    let currentSearchParams = {
      plant: '',
      countDate: ''
    };

    /**
     * Search data from AppSheet API
     */
    function searchData() {
      const plantRadio = document.querySelector('input[name="plant"]:checked');
      const countDateInput = document.getElementById('countDate').value;

      // Validation
      if (!plantRadio) {
        showError('Please select Plant');
        return;
      }

      if (!countDateInput) {
        showError('Please select Date');
        return;
      }

      const plant = plantRadio.value;
      const countDate = formatDateForAppSheet(countDateInput);

      // Store search params
      currentSearchParams.plant = plant;
      currentSearchParams.countDate = countDateInput;

      // Show loading
      hideError();
      showLoading(true);
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('searchBtn').disabled = true;

      // Call API via Google Apps Script
      google.script.run
        .withSuccessHandler(handleSearchSuccess)
        .withFailureHandler(handleSearchError)
        .searchInventoryData(plant, countDate);
    }

    /**
     * Handle search success
     */
    function handleSearchSuccess(result) {
      showLoading(false);
      document.getElementById('searchBtn').disabled = false;

      if (result.success) {
        inventoryData = result.data || [];
        updateDisplay();
        renderTable();
      } else {
        showError('Error: ' + (result.error || 'Unknown error'));
        inventoryData = [];
        renderTable();
      }
    }

    /**
     * Handle search error
     */
    function handleSearchError(error) {
      showLoading(false);
      document.getElementById('searchBtn').disabled = false;
      showError('Connection error: ' + error.message);
    }

    /**
     * Update display
     */
    function updateDisplay() {
      document.getElementById('displayPlant').textContent = currentSearchParams.plant;
      document.getElementById('displayDate').textContent = formatDateThai(currentSearchParams.countDate);
      document.getElementById('displayCount').textContent = inventoryData.length;

      const total = inventoryData.length;
      let match = 0;
      let unmatch = 0;
      let pending = 0;

      inventoryData.forEach(item => {
        const result = (item.result_st1_counts || '').toLowerCase();
        if (result === 'match') {
          match++;
        } else if (result === 'unmatch' || result === 'not match') {
          unmatch++;
        } else {
          pending++;
        }
      });

      document.getElementById('totalItems').textContent = total;
      document.getElementById('matchItems').textContent = match;
      document.getElementById('unmatchItems').textContent = unmatch;
      document.getElementById('pendingItems').textContent = pending;
    }

    /**
     * Render table
     */
    function renderTable() {
      const tableBody = document.getElementById('tableBody');
      const noData = document.getElementById('noData');
      const tableContainer = document.getElementById('tableContainer');

      if (inventoryData.length === 0) {
        tableContainer.style.display = 'none';
        noData.style.display = 'block';
        return;
      }

      tableContainer.style.display = 'block';
      noData.style.display = 'none';

      let html = '';
      inventoryData.forEach((item, index) => {
        const result1st = (item.result_st1_counts || '').toLowerCase();
        const result1stClass = result1st === 'match' ? 'match' : (result1st ? 'unmatch' : '');

        const result2nd = (item.result_nd2_counts || '').toLowerCase();
        const result2ndClass = result2nd === 'match' ? 'match' : (result2nd ? 'unmatch' : '');

        const result3rd = (item.result_rd3_counts || '').toLowerCase();
        const result3rdClass = result3rd === 'match' ? 'match' : (result3rd ? 'unmatch' : '');

        html += `
          <tr>
            <td>${index + 1}</td>
            <td>${item.part_number || '-'}</td>
            <td>${item.part_name || '-'}</td>
            <td>${item.Location || '-'}</td>
            <td>${item.uom || '-'}</td>
            <td>${item.suggest_totals || '-'}</td>
            <td>${item.summary_st1 || '-'}</td>
            <td class="${result1stClass}">${item.result_st1_counts || '-'}</td>
            <td>${item.summary_nd2 || '-'}</td>
            <td class="${result2ndClass}">${item.result_nd2_counts || '-'}</td>
            <td>${item.summary_rd3 || '-'}</td>
            <td class="${result3rdClass}">${item.result_rd3_counts || '-'}</td>
            <td>${item.Status || '-'}</td>
          </tr>
        `;
      });

      tableBody.innerHTML = html;
    }

    /**
     * Clear all data
     */
    function clearData() {
      inventoryData = [];
      currentSearchParams = { plant: '', countDate: '' };

      // Clear radio selection
      const plantRadios = document.querySelectorAll('input[name="plant"]');
      plantRadios.forEach(radio => radio.checked = false);

      document.getElementById('countDate').value = '';
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('tableBody').innerHTML = '';

      hideError();
    }

    /**
     * Format date to MM/DD/YYYY
     */
    function formatDateForAppSheet(dateStr) {
      const date = new Date(dateStr);
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const year = date.getFullYear();
      return `${month}/${day}/${year}`;
    }

    /**
     * Format date to Thai format
     */
    function formatDateThai(dateStr) {
      const date = new Date(dateStr);
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      return date.toLocaleDateString('th-TH', options);
    }

    /**
     * Show/hide loading
     */
    function showLoading(show) {
      const loading = document.getElementById('loadingIndicator');
      const tableContainer = document.getElementById('tableContainer');
      const summaryCards = document.getElementById('summaryCards');

      if (show) {
        loading.classList.add('show');
        tableContainer.style.display = 'none';
        summaryCards.style.display = 'none';
      } else {
        loading.classList.remove('show');
        summaryCards.style.display = 'grid';
      }
    }

    /**
     * Show error message
     */
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }

    /**
     * Hide error message
     */
    function hideError() {
      document.getElementById('errorMessage').classList.remove('show');
    }

    /**
     * Get stored data from RAM
     */
    function getStoredData() {
      return inventoryData;
    }

    /**
     * Get item by index
     */
    function getItemByIndex(index) {
      return inventoryData[index] || null;
    }

    /**
     * Find by part number
     */
    function findByPartNumber(partNumber) {
      return inventoryData.filter(item =>
        item.part_number && item.part_number.toLowerCase().includes(partNumber.toLowerCase())
      );
    }
  </script>
</body>
</html>
