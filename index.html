<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Counting</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      padding: 12px;
      margin-bottom: 10px;
    }

    .search-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group label {
      font-weight: 600;
      color: #333;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .radio-group {
      display: flex;
      gap: 10px;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .radio-item input[type="radio"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .radio-item label {
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
    }

    input[type="date"] {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.8rem;
      width: 130px;
    }

    input[type="date"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .button-group {
      display: flex;
      gap: 6px;
    }

    /* Summary Cards - Inline */
    .summary-inline {
      display: none;
      gap: 6px;
      margin-left: auto;
    }

    .summary-inline.show {
      display: flex;
    }

    .summary-badge {
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-badge .num {
      font-weight: 700;
    }

    .summary-badge.total {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .summary-badge.match {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    }

    .summary-badge.pending {
      background: linear-gradient(135deg, #fd7e14 0%, #ffc107 100%);
    }

    .summary-badge.unmatch {
      background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
    }

    .data-table-container {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .data-table th {
      background: #667eea;
      color: white;
      padding: 8px 10px;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 10;
      font-size: 0.75rem;
    }

    .data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    .data-table tr:hover {
      background: #f5f5f5;
    }

    .data-table tr:nth-child(even) {
      background: #f9f9f9;
    }

    .data-table tr:nth-child(even):hover {
      background: #f0f0f0;
    }

    .match {
      color: #28a745;
      font-weight: 600;
    }

    .unmatch {
      color: #dc3545;
      font-weight: 600;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 30px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: #6c757d;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
      font-size: 0.85rem;
    }

    .error-message.show {
      display: block;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .pagination button {
      padding: 5px 10px;
      border: 1px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      background: #667eea;
      color: white;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination button.active {
      background: #667eea;
      color: white;
    }

    .pagination .page-info {
      font-size: 0.8rem;
      color: #666;
      margin: 0 10px;
    }

    @media (max-width: 768px) {
      .search-box {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-group {
        width: 100%;
        flex-wrap: wrap;
      }

      .radio-group {
        flex-wrap: wrap;
      }

      .summary-inline {
        width: 100%;
        flex-wrap: wrap;
        margin-left: 0;
        margin-top: 8px;
      }

      .data-table {
        font-size: 0.7rem;
      }

      .data-table th,
      .data-table td {
        padding: 5px 6px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 5px;
      }

      .card {
        padding: 8px;
      }

      .summary-badge {
        padding: 3px 8px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="search-box">
        <div class="form-group">
          <label>Plant:</label>
          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" id="plantSiam" name="plant" value="SIAM">
              <label for="plantSiam">SIAM</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="plantAsia" name="plant" value="ASIA">
              <label for="plantAsia">ASIA</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="plantThai" name="plant" value="THAI">
              <label for="plantThai">THAI</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="countDate">Date:</label>
          <input type="date" id="countDate">
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="searchBtn" onclick="searchData()">Search</button>
          <button class="btn btn-secondary" onclick="clearData()">Clear</button>
        </div>

        <div class="summary-inline" id="summaryInline">
          <span class="summary-badge total"><span class="num" id="totalItems">0</span> Total</span>
          <span class="summary-badge match"><span class="num" id="matchItems">0</span> Match</span>
          <span class="summary-badge pending"><span class="num" id="pendingItems">0</span> Pending</span>
          <span class="summary-badge unmatch"><span class="num" id="unmatchItems">0</span> Unmatch</span>
        </div>
      </div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="card" id="resultCard" style="display: none;">
      <div class="loading" id="loadingIndicator">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>

      <div class="data-table-container" id="tableContainer">
        <table class="data-table" id="dataTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Part Number</th>
              <th>Part Name</th>
              <th>Location</th>
              <th>UOM</th>
              <th>Suggest</th>
              <th>Count 1st</th>
              <th>Result 1st</th>
              <th>Count 2nd</th>
              <th>Result 2nd</th>
              <th>Count 3rd</th>
              <th>Result 3rd</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>

      <div class="no-data" id="noData" style="display: none;">
        <p>No data found</p>
      </div>
    </div>
  </div>

  <script>
    // Store data in RAM
    let inventoryData = [];
    let currentSearchParams = {
      plant: '',
      countDate: ''
    };

    // Pagination settings
    const ROWS_PER_PAGE = 10;
    let currentPage = 1;
    let totalPages = 1;

    /**
     * Search data from AppSheet API
     */
    function searchData() {
      const plantRadio = document.querySelector('input[name="plant"]:checked');
      const countDateInput = document.getElementById('countDate').value;

      // Validation
      if (!plantRadio) {
        showError('Please select Plant');
        return;
      }

      if (!countDateInput) {
        showError('Please select Date');
        return;
      }

      const plant = plantRadio.value;
      const countDate = formatDateForAppSheet(countDateInput);

      // Store search params
      currentSearchParams.plant = plant;
      currentSearchParams.countDate = countDateInput;

      // Show loading
      hideError();
      showLoading(true);
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('searchBtn').disabled = true;

      // Call API via Google Apps Script
      google.script.run
        .withSuccessHandler(handleSearchSuccess)
        .withFailureHandler(handleSearchError)
        .searchInventoryData(plant, countDate);
    }

    /**
     * Handle search success
     */
    function handleSearchSuccess(result) {
      showLoading(false);
      document.getElementById('searchBtn').disabled = false;

      if (result.success) {
        inventoryData = result.data || [];
        currentPage = 1;
        totalPages = Math.ceil(inventoryData.length / ROWS_PER_PAGE) || 1;
        updateDisplay();
        renderTable();
        renderPagination();
      } else {
        showError('Error: ' + (result.error || 'Unknown error'));
        inventoryData = [];
        renderTable();
      }
    }

    /**
     * Handle search error
     */
    function handleSearchError(error) {
      showLoading(false);
      document.getElementById('searchBtn').disabled = false;
      showError('Connection error: ' + error.message);
    }

    /**
     * Update display
     */
    function updateDisplay() {
      const total = inventoryData.length;
      let match = 0;
      let unmatch = 0;
      let pending = 0;

      inventoryData.forEach(item => {
        const result = (item.result_st1_counts || '').toLowerCase();
        if (result === 'match') {
          match++;
        } else if (result === 'unmatch' || result === 'not match') {
          unmatch++;
        } else {
          pending++;
        }
      });

      document.getElementById('totalItems').textContent = total;
      document.getElementById('matchItems').textContent = match;
      document.getElementById('unmatchItems').textContent = unmatch;
      document.getElementById('pendingItems').textContent = pending;

      // Show summary inline
      document.getElementById('summaryInline').classList.add('show');
    }

    /**
     * Render table with pagination
     */
    function renderTable() {
      const tableBody = document.getElementById('tableBody');
      const noData = document.getElementById('noData');
      const tableContainer = document.getElementById('tableContainer');

      if (inventoryData.length === 0) {
        tableContainer.style.display = 'none';
        document.getElementById('pagination').style.display = 'none';
        noData.style.display = 'block';
        return;
      }

      tableContainer.style.display = 'block';
      noData.style.display = 'none';

      // Calculate pagination
      const startIndex = (currentPage - 1) * ROWS_PER_PAGE;
      const endIndex = Math.min(startIndex + ROWS_PER_PAGE, inventoryData.length);
      const pageData = inventoryData.slice(startIndex, endIndex);

      let html = '';
      pageData.forEach((item, index) => {
        const globalIndex = startIndex + index + 1;
        const result1st = (item.result_st1_counts || '').toLowerCase();
        const result1stClass = result1st === 'match' ? 'match' : (result1st ? 'unmatch' : '');

        const result2nd = (item.result_nd2_counts || '').toLowerCase();
        const result2ndClass = result2nd === 'match' ? 'match' : (result2nd ? 'unmatch' : '');

        const result3rd = (item.result_rd3_counts || '').toLowerCase();
        const result3rdClass = result3rd === 'match' ? 'match' : (result3rd ? 'unmatch' : '');

        html += `
          <tr>
            <td>${globalIndex}</td>
            <td>${item.part_number || '-'}</td>
            <td>${item.part_name || '-'}</td>
            <td>${item.Location || '-'}</td>
            <td>${item.uom || '-'}</td>
            <td>${item.suggest_totals || '-'}</td>
            <td>${item.summary_st1 || '-'}</td>
            <td class="${result1stClass}">${item.result_st1_counts || '-'}</td>
            <td>${item.summary_nd2 || '-'}</td>
            <td class="${result2ndClass}">${item.result_nd2_counts || '-'}</td>
            <td>${item.summary_rd3 || '-'}</td>
            <td class="${result3rdClass}">${item.result_rd3_counts || '-'}</td>
            <td>${item.Status || '-'}</td>
          </tr>
        `;
      });

      tableBody.innerHTML = html;
    }

    /**
     * Render pagination controls
     */
    function renderPagination() {
      const paginationContainer = document.getElementById('pagination');

      if (inventoryData.length === 0) {
        paginationContainer.style.display = 'none';
        return;
      }

      paginationContainer.style.display = 'flex';

      let html = '';

      // First & Prev buttons
      html += `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>&laquo;</button>`;
      html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&lsaquo;</button>`;

      // Page numbers
      const maxVisiblePages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

      if (endPage - startPage + 1 < maxVisiblePages) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }

      if (startPage > 1) {
        html += `<button onclick="goToPage(1)">1</button>`;
        if (startPage > 2) {
          html += `<span class="page-info">...</span>`;
        }
      }

      for (let i = startPage; i <= endPage; i++) {
        html += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          html += `<span class="page-info">...</span>`;
        }
        html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
      }

      // Next & Last buttons
      html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>&rsaquo;</button>`;
      html += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>&raquo;</button>`;

      // Page info
      const startItem = (currentPage - 1) * ROWS_PER_PAGE + 1;
      const endItem = Math.min(currentPage * ROWS_PER_PAGE, inventoryData.length);
      html += `<span class="page-info">${startItem}-${endItem} of ${inventoryData.length}</span>`;

      paginationContainer.innerHTML = html;
    }

    /**
     * Go to specific page
     */
    function goToPage(page) {
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderTable();
      renderPagination();

      // Scroll to top of table
      document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
    }

    /**
     * Clear all data
     */
    function clearData() {
      inventoryData = [];
      currentSearchParams = { plant: '', countDate: '' };
      currentPage = 1;
      totalPages = 1;

      // Clear radio selection
      const plantRadios = document.querySelectorAll('input[name="plant"]');
      plantRadios.forEach(radio => radio.checked = false);

      document.getElementById('countDate').value = '';
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('summaryInline').classList.remove('show');

      hideError();
    }

    /**
     * Format date to MM/DD/YYYY
     */
    function formatDateForAppSheet(dateStr) {
      const date = new Date(dateStr);
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const year = date.getFullYear();
      return `${month}/${day}/${year}`;
    }

    /**
     * Format date to Thai format
     */
    function formatDateThai(dateStr) {
      const date = new Date(dateStr);
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      return date.toLocaleDateString('th-TH', options);
    }

    /**
     * Show/hide loading
     */
    function showLoading(show) {
      const loading = document.getElementById('loadingIndicator');
      const tableContainer = document.getElementById('tableContainer');
      const pagination = document.getElementById('pagination');

      if (show) {
        loading.classList.add('show');
        tableContainer.style.display = 'none';
        pagination.style.display = 'none';
      } else {
        loading.classList.remove('show');
      }
    }

    /**
     * Show error message
     */
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }

    /**
     * Hide error message
     */
    function hideError() {
      document.getElementById('errorMessage').classList.remove('show');
    }

    /**
     * Get stored data from RAM
     */
    function getStoredData() {
      return inventoryData;
    }

    /**
     * Get item by index
     */
    function getItemByIndex(index) {
      return inventoryData[index] || null;
    }

    /**
     * Find by part number
     */
    function findByPartNumber(partNumber) {
      return inventoryData.filter(item =>
        item.part_number && item.part_number.toLowerCase().includes(partNumber.toLowerCase())
      );
    }
  </script>
</body>
</html>
